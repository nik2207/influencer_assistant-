x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://assistant:assistant@db:5432/assistant
    REDIS_URL: redis://redis:6379/0
  depends_on: [db, redis]
  volumes: ["./data:/srv/data"]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
  api:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: celery -A app.worker.celery worker -B -l info
  bot:
    <<: *app
    command: python -m bot.telegram_bot
    profiles: ["telegram"]

volumes:
  pgdata:
